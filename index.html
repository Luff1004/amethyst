<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<title>AMETHYST</title>
<meta name="description" content="화면 전체가 게임인 확률형 채굴 게임 - 크리스탈을 캐고 희귀 광물 컷신을 모아보세요">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css?v=2026101010">

<body>
<canvas id="game"></canvas>

<header id="hud">
  <div class="wrap">
    <div id="topline">
      <div id="coinBox"><i id="coinIco"></i><div><small>COINS</small><b id="coinVal">0</b><em id="crysRow"><i id="crysIco"></i><span id="crysVal">0</span><span id="yelVal" class="cur yel"></span><span id="redVal" class="cur red"></span><span id="cps"></span></em></div></div>
      <button id="btnEvent" class="bevel" hidden></button>
      <div id="rightBox">
        <div id="luckChip" class="bevel"><span>LUCK</span><b id="luckVal">x1.00</b></div>
        <button id="btnAuto" class="bevel" aria-label="auto"></button>
        <button id="btnSound" class="bevel" aria-label="sound"></button>
        <button id="btnGear" class="bevel" aria-label="settings"></button>
      </div>
    </div>
    <nav id="tabs">
      <button class="tab bevel" data-tab="shop"><span>상점</span></button>
      <button class="tab bevel" data-tab="map"><span>지도</span></button>
      <button class="tab bevel" data-tab="up"><span>강화</span></button>
      <button class="tab bevel" data-tab="codex"><span>도감</span></button>
      <button class="tab bevel" data-tab="crystal"><span>크리스탈</span></button>
    </nav>
    <div id="wxrow"><button id="wxChip" class="bevel" hidden></button><div id="buffs"></div></div>
    <div id="wxPop" hidden></div>
    <section id="panel" class="bevel" hidden></section>
  </div>
</header>

<div id="hint"><b>TAP</b><span>화면을 터치해 채굴하세요</span></div>
<div id="foot"></div>
<div id="toast"></div>
<div id="luckPop" hidden></div>
<div id="win"></div>
<div id="tutorial" hidden></div>
<div id="eventModal" hidden></div>
<div id="boxSpin" hidden><div class="spinwrap"><div class="spinlabel">OPENING</div><div class="spintrack"><div class="spinptr"></div><div class="spinstrip"></div><div class="spinfade l"></div><div class="spinfade r"></div></div></div></div>
<div id="level1" hidden></div>
<div id="jumpscare" hidden></div>
<div id="offlineModal" hidden></div>
<div id="wxAnnounce"></div>
<div id="bossPrompt" hidden></div>
<button id="cutPause" type="button" title="30초 동안 컷신 없이 보상만 받습니다">컷신 잠깐 안 나오게 하기</button>
